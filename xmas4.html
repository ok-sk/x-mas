<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クリスマスAR - サンタ＆トナカイ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Face Landmarker & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <style>
        body {
            overscroll-behavior: none;
            background-color: #0f1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.9; }
            50% { transform: translateY(-15px) rotate(5deg); opacity: 1; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.9; }
        }
        .floating-item {
            animation: float 4s ease-in-out infinite;
        }
        .floating-item-delayed {
            animation: float 5s ease-in-out infinite 2s;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- ヘッダー -->
    <header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between p-4 bg-gradient-to-b from-black/80 to-transparent pointer-events-auto">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🎄</span>
            <h1 class="text-lg font-bold tracking-wider text-red-400">CHRISTMAS AR</h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- ジンジャーブレッドON/OFFボタン -->
            <button id="toggle-ghosts-btn" class="p-2.5 bg-black/40 hover:bg-black/60 backdrop-blur-md rounded-full border border-white/10 transition text-sm" title="背景装飾の表示/非表示">
                🍪
            </button>
            <!-- カメラ切り替えボタン -->
            <button id="switch-camera-btn" class="p-2.5 bg-black/40 hover:bg-black/60 backdrop-blur-md rounded-full border border-white/10 transition" title="カメラ切り替え">
                🔄
            </button>
        </div>
    </header>

    <!-- メインビューポート (カメラ & AR Canvas) -->
    <main class="relative flex-1 w-full h-full overflow-hidden bg-black flex items-center justify-center">
        <!-- 内部処理用ビデオ要素 -->
        <video id="webcam" class="absolute opacity-0 pointer-events-none" playsinline></video>
        <!-- AR描画キャンバス -->
        <canvas id="output-canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>

        <!-- 背景のジンジャーブレッドマンと雪の結晶 -->
        <div id="ghosts-container" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>

        <!-- ローディング・スタートオーバーレイ -->
        <div id="loading-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/90 p-6 text-center">
            <div id="spinner" class="w-16 h-16 border-4 border-red-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 id="loading-title" class="text-xl font-bold text-red-400 mb-2">クリスマスAR準備中...</h2>
            <p id="loading-desc" class="text-sm text-gray-300 max-w-xs mb-6">AIモデルを読み込んでいます。</p>
            <button id="start-btn" class="hidden px-8 py-3.5 bg-gradient-to-r from-red-600 to-emerald-600 hover:from-red-700 hover:to-emerald-700 text-white font-bold rounded-full shadow-lg shadow-red-500/40 transition transform active:scale-95 pointer-events-auto">
                🎅 カメラを起動してスタート
            </button>
        </div>
    </main>

    <!-- フッターコントロール -->
    <footer class="absolute bottom-0 left-0 right-0 z-30 p-4 pb-8 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex flex-col items-center space-y-3 pointer-events-auto">
        <!-- スタイル選択 (サンタ / トナカイ) -->
        <div class="flex items-center space-x-2 bg-black/50 backdrop-blur-md p-1.5 rounded-full border border-white/10">
            <button class="style-btn px-4 py-1.5 text-xs font-semibold rounded-full bg-red-600 text-white transition shadow" data-style="santa">
                🎅 サンタクロース
            </button>
            <button class="style-btn px-4 py-1.5 text-xs font-semibold rounded-full text-gray-300 hover:text-white transition" data-style="reindeer">
                🦌 トナカイ
            </button>
        </div>

        <!-- 撮影ボタン -->
        <div class="flex items-center justify-center w-full">
            <button id="capture-btn" class="relative group p-1 bg-gradient-to-r from-red-500 to-emerald-500 rounded-full shadow-lg shadow-red-500/30 active:scale-95 transition">
                <div class="w-16 h-16 bg-black rounded-full flex items-center justify-center p-2">
                    <div class="w-full h-full bg-red-500 rounded-full group-hover:bg-red-400 transition flex items-center justify-center text-xl">
                        📸
                    </div>
                </div>
            </button>
        </div>
    </footer>

    <!-- 写真撮影フラッシュエフェクト -->
    <div id="flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-40 transition-opacity duration-300"></div>

    <!-- アプリケーションロジック -->
    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        let faceLandmarker;
        let camera = null;
        let currentStyle = "santa";
        let currentFacingMode = "user";
        let decorationsVisible = true;
        let lastVideoTime = -1;
        let results = undefined;

        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output-canvas");
        const ctx = canvas.getContext("2d");
        const loadingOverlay = document.getElementById("loading-overlay");
        const loadingTitle = document.getElementById("loading-title");
        const loadingDesc = document.getElementById("loading-desc");
        const startBtn = document.getElementById("start-btn");
        const spinner = document.getElementById("spinner");
        const captureBtn = document.getElementById("capture-btn");
        const switchCameraBtn = document.getElementById("switch-camera-btn");
        const toggleGhostsBtn = document.getElementById("toggle-ghosts-btn");
        const ghostsContainer = document.getElementById("ghosts-container");
        const flash = document.getElementById("flash");
        const styleBtns = document.querySelectorAll(".style-btn");

        async function initializeFaceLandmarker() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                // ハロウィン版と同様の安定した1人用AIモデル設定
                faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: false,
                    runningMode: "VIDEO",
                    numFaces: 1
                });
                
                spinner.classList.add("hidden");
                loadingTitle.textContent = "クリスマスARへようこそ！";
                loadingDesc.textContent = "スタートボタンを押してカメラを許可してください。";
                startBtn.classList.remove("hidden");
            } catch (error) {
                console.error(error);
                spinner.classList.add("hidden");
                loadingTitle.textContent = "初期化エラー";
                loadingDesc.textContent = "モデルの読み込みに失敗しました。再読み込みしてください。";
            }
        }

        initializeFaceLandmarker();

        async function onResults() {
            if (!video.videoWidth) return;

            if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (faceLandmarker) {
                    try {
                        results = faceLandmarker.detectForVideo(video, performance.now());
                    } catch (e) {
                        console.error(e);
                    }
                }
            }

            // 顔が検出された場合は顔の位置に追従して描画、検出されない場合は描画しない
            if (results && results.faceLandmarks && results.faceLandmarks.length > 0) {
                drawChristmasMask(results.faceLandmarks[0]);
            }
        }

        async function startCamera() {
            if (camera) {
                try { camera.stop(); } catch(e) {}
            }

            try {
                camera = new Camera(video, {
                    onFrame: async () => {
                        await onResults();
                    },
                    width: 1280,
                    height: 720,
                    facingMode: currentFacingMode
                });
                await camera.start();
                loadingOverlay.classList.add("hidden");
            } catch (err) {
                console.error(err);
                spinner.classList.add("hidden");
                loadingTitle.textContent = "カメラアクセスエラー";
                loadingDesc.textContent = "ブラウザのカメラ権限を確認してください。";
                startBtn.textContent = "🔄 もう一度試す";
                startBtn.classList.remove("hidden");
            }
        }

        startBtn.addEventListener("click", async () => {
            startBtn.classList.add("hidden");
            spinner.classList.remove("hidden");
            loadingTitle.textContent = "カメラを起動中...";
            loadingDesc.textContent = "アクセスを許可してください。";
            await startCamera();
        });

        switchCameraBtn.addEventListener("click", async () => {
            currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
            loadingOverlay.classList.remove("hidden");
            loadingTitle.textContent = "カメラを切り替え中...";
            loadingDesc.textContent = "少々お待ちください。";
            spinner.classList.remove("hidden");
            startBtn.classList.add("hidden");
            await startCamera();
        });

        toggleGhostsBtn.addEventListener("click", () => {
            decorationsVisible = !decorationsVisible;
            if (decorationsVisible) {
                ghostsContainer.classList.remove("hidden");
                toggleGhostsBtn.style.opacity = "1";
            } else {
                ghostsContainer.classList.add("hidden");
                toggleGhostsBtn.style.opacity = "0.4";
            }
        });

        styleBtns.forEach(btn => {
            btn.addEventListener("click", (e) => {
                styleBtns.forEach(b => {
                    b.classList.remove("bg-red-600", "text-white");
                    b.classList.add("text-gray-300");
                });
                const target = e.currentTarget;
                target.classList.add("bg-red-600", "text-white");
                target.classList.remove("text-gray-300");
                currentStyle = target.getAttribute("data-style");
            });
        });

        function updateGingerbreadIcons() {
            const svgGingerbread = `
                <svg viewBox="0 0 100 120" class="w-12 h-14 drop-shadow-lg">
                    <path d="M50 10 C40 10, 35 20, 35 30 C25 32, 10 38, 15 50 C20 60, 25 55, 30 52 L32 75 C20 95, 25 110, 35 110 C45 110, 48 95, 50 85 C52 95, 55 110, 65 110 C75 110, 80 95, 68 75 L70 52 C75 55, 80 60, 85 50 C90 38, 75 32, 65 30 C65 20, 60 10, 50 10 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
                    <circle cx="43" cy="27" r="3.5" fill="white"/>
                    <circle cx="57" cy="27" r="3.5" fill="white"/>
                    <path d="M43 33 Q50 40 57 33" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M45 44 L55 44 L50 49 Z" fill="#ef4444"/>
                    <path d="M45 49 L55 49 L50 44 Z" fill="#ef4444"/>
                    <circle cx="50" cy="46" r="2" fill="white"/>
                    <circle cx="50" cy="62" r="3" fill="white"/>
                    <circle cx="50" cy="74" r="3" fill="white"/>
                    <path d="M18 45 Q22 42 26 48" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M74 45 Q78 42 82 48" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M28 95 Q33 92 38 98" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <path d="M62 95 Q67 92 72 98" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                </svg>
            `;
            ghostsContainer.innerHTML = `
                <div class="absolute top-20 left-6 floating-item">${svgGingerbread}</div>
                <div class="absolute top-36 right-8 text-3xl floating-item-delayed">❄️</div>
                <div class="absolute bottom-40 right-10 floating-item-delayed">${svgGingerbread}</div>
                <div class="absolute bottom-28 left-6 text-3xl floating-item">❄️</div>
            `;
        }
        updateGingerbreadIcons();

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // 顔のランドマークに追従してマスクを描画する関数
        function drawChristmasMask(landmarks) {
            const leftEar = landmarks[234];
            const rightEar = landmarks[454];
            const chin = landmarks[152];
            const forehead = landmarks[10];

            const cx = (leftEar.x + rightEar.x) / 2 * canvas.width;
            const cy = (forehead.y + chin.y) / 2 * canvas.height;

            const dx = (rightEar.x - leftEar.x) * canvas.width;
            const dy = (rightEar.y - leftEar.y) * canvas.height;
            const faceWidth = Math.sqrt(dx * dx + dy * dy);
            
            const angle = Math.atan2(dy, dx);
            const radius = faceWidth * 1.35;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            if (currentStyle === "santa") {
                ctx.beginPath();
                ctx.ellipse(0, radius * -0.08, radius * 0.7, radius * 0.7, 0, 0, Math.PI * 2);

                const holeW = radius * 0.37;
                const holeH = radius * 0.45;
                ctx.ellipse(0, radius * -0.08, holeW, holeH, 0, 0, Math.PI * 2, true);
                ctx.fillStyle = "#FEDA7E";
                ctx.fill("evenodd");
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.moveTo(-radius * 0.55, -radius * 0.65);
                ctx.lineTo(radius * 0.55, -radius * 0.65);
                ctx.lineTo(radius * 0.25, -radius * 1.25);
                ctx.closePath();
                ctx.fillStyle = "#dc2626";
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                drawRoundedRect(ctx, -radius * 0.55, -radius * 0.75, radius * 1.2, radius * 0.22, 12);

                ctx.beginPath();
                ctx.arc(radius * 0.25, -radius * 1.25, radius * 0.16, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff";
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.moveTo(-radius * 0.4, radius * 0.08 + holeH * 0.5);
                ctx.lineTo(radius * 0.4, radius * 0.08 + holeH * 0.5);
                ctx.lineTo(0, radius * 0.08 + holeH * 1.4);
                ctx.closePath();
                ctx.fill();

            } else {
                ctx.beginPath();
                ctx.ellipse(0, 0, radius * 0.9, radius * 0.8, 0, 0, Math.PI * 2);
                const holeW = radius * 0.37;
                const holeH = radius * 0.50;
                ctx.ellipse(0, radius * 0.08, holeW, holeH, 0, 0, Math.PI * 2, true);

                ctx.fillStyle = "#C89460";
                ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = 20;
                ctx.fill("evenodd");
                ctx.shadowBlur = 0;

                ctx.strokeStyle = "#78350f";
                ctx.lineWidth = 16;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                ctx.beginPath();
                ctx.moveTo(-radius * 0.25, -radius * 0.75);
                ctx.lineTo(-radius * 0.45, -radius * 1.25);
                ctx.moveTo(-radius * 0.55, -radius * 1.15);
                ctx.lineTo(-radius * 0.40, -radius * 1.05);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(radius * 0.25, -radius * 0.75);
                ctx.lineTo(radius * 0.45, -radius * 1.25);
                ctx.moveTo(radius * 0.55, -radius * 1.15);
                ctx.lineTo(radius * 0.40, -radius * 1.05);
                ctx.stroke();

                ctx.fillStyle = "#C89460";
                ctx.beginPath();
                ctx.ellipse(-radius * 0.55, -radius * 0.65, radius * 0.16, radius * 0.28, -1.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(radius * 0.55, -radius * 0.65, radius * 0.16, radius * 0.28, 1.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(-radius * 0.28, -radius * 0.52, radius * 0.12, 0, Math.PI * 2);
                ctx.arc(radius * 0.28, -radius * 0.52, radius * 0.12, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(-radius * 0.28, -radius * 0.52, radius * 0.05, 0, Math.PI * 2);
                ctx.arc(radius * 0.28, -radius * 0.52, radius * 0.05, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, -radius * 0.45, radius * 0.10, 0, Math.PI * 2);
                ctx.fillStyle = "#ef4444";
                ctx.shadowColor = "#ef4444";
                ctx.shadowBlur = 18;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        }

        // 写真撮影
        captureBtn.addEventListener("click", () => {
            flash.style.opacity = "1";
            setTimeout(() => { flash.style.opacity = "0"; }, 300);

            const link = document.createElement("a");
            link.download = `christmas-ar-${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    </script>
</body>
</html>
